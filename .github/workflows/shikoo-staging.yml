name: Shikoo Staging

on:
  workflow_run:
    workflows: [Shikoo CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# a dispatch from another branch is a dry run: it must neither wait behind nor cancel a pending release or promote
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'shikoo-release' || format('shikoo-dry-run-{0}', github.ref) }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.1'
  GO_VERSION: '1.26.4'
  NDK_VERSION: r28c
  VERSION_PREFIX: '1.0'
  APP_ID: com.shikoonet.app
  PRODUCTION_API: https://app.chopon.uk
  PRODUCTION_BOT: shikoonet_bot
  STAGING_API: ${{ vars.SHIKOO_STAGING_API || 'https://app-dev.chopon.uk' }}
  STAGING_BOT: ${{ vars.SHIKOO_STAGING_BOT || 'shikoodevbot' }}
  RELEASE_CERT_SHA256: dbf909bae41e5aaf30e55b345a195e913cff5ae34d6d97d586e1b95b0d9c29de
  STAGING_CERT_DN: CN=ShikooNet Staging

jobs:
  commit:
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      vn: ${{ steps.commit.outputs.vn }}
      publish: ${{ steps.commit.outputs.publish }}
      api: ${{ steps.server.outputs.api }}
      bot: ${{ steps.server.outputs.bot }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - id: commit
        name: The commit CI passed on main, merged from a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          vn=$VERSION_PREFIX.$GITHUB_RUN_NUMBER
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$REF" != refs/heads/main ]; then
            echo "::notice::dry run from $REF: builds and checks $GITHUB_SHA, publishes nothing"
            printf 'sha=%s\nvn=%s\npublish=false\n' "$GITHUB_SHA" "$vn" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          sha=${RUN_SHA:-$(gh api "repos/$GH_REPO/commits/main" --jq .sha)}
          gh run list --workflow shikoo-ci.yml --commit "$sha" --branch main --event push --status success \
            --json databaseId --jq '.[0].databaseId' | grep -q . ||
            { echo "::error::CI has not passed on $sha as a push to main"; exit 1; }
          [ "$(gh api "repos/$GH_REPO/commits/$sha/pulls" --jq '[.[] | select(.merged_at)] | length')" -gt 0 ] ||
            { echo "::error::$sha came from no merged pull request; a direct push to main is not released"; exit 1; }
          printf 'sha=%s\nvn=%s\npublish=true\n' "$sha" "$vn" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.commit.outputs.sha }}
          persist-credentials: false

      - id: server
        name: The app takes its server and bot from the build, and staging points away from production
        run: |
          set -euo pipefail
          for key in SHIKOO_API SHIKOO_BOT; do
            grep -rqzP "fromEnvironment\s*\(\s*'$key'" lib/shikoo ||
              { echo "::error::lib/shikoo does not read $key from the build"; exit 1; }
          done
          api=${STAGING_API%/} bot=${STAGING_BOT#@}
          [ "${api,,}" != "${PRODUCTION_API,,}" ] && [ "${bot,,}" != "${PRODUCTION_BOT,,}" ] ||
            { echo "::error::staging must not point at the production server or bot"; exit 1; }
          printf 'api=%s\nbot=%s\n' "$api" "$bot" >>"$GITHUB_OUTPUT"

  build:
    needs: commit
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      matrix:
        flavor: [staging, production]
    env:
      VN: ${{ needs.commit.outputs.vn }}
    steps:
      - name: Free disk space, which one cold Android build overruns on a hosted runner (run 37618279233)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/share/swift /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk/*
          sudo docker image prune -af >/dev/null
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.commit.outputs.sha }}
          submodules: recursive
          persist-credentials: false

      - run: bash tools/core-patches/apply.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      # staging builds every ABI production does and x86_64 too, so only its cache is saved
      - if: matrix.flavor == 'staging'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            .dart_tool/hooks_runner
            .dart_tool/setup_build_cache
            libclash
          key: native-${{ hashFiles('core/**', 'build_config.yaml', 'plugins/setup/**', 'plugins/rust_api/rust/**') }}
          restore-keys: native-

      - if: matrix.flavor == 'production'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            .dart_tool/hooks_runner
            .dart_tool/setup_build_cache
            libclash
          key: native-${{ hashFiles('core/**', 'build_config.yaml', 'plugins/setup/**', 'plugins/rust_api/rust/**') }}
          restore-keys: native-

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - run: flutter pub get

      # no keystore.jks yet, so FlClash's gradle signs with the debug config and adds the .dev suffix
      - name: Staging APKs
        if: matrix.flavor == 'staging'
        env:
          STAGING_KEYSTORE_B64: ${{ secrets.SHIKOO_STAGING_KEYSTORE_B64 }}
          API: ${{ needs.commit.outputs.api }}
          BOT: ${{ needs.commit.outputs.bot }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          # AGP takes its debug keystore from here first; unset, from $XDG_CONFIG_HOME/.android, which the image sets
          ANDROID_USER_HOME: ${{ runner.temp }}/android-user
        run: |
          set -euo pipefail
          [ -n "$STAGING_KEYSTORE_B64" ] || { echo "::error::set the secret SHIKOO_STAGING_KEYSTORE_B64"; exit 1; }
          mkdir -p "$ANDROID_USER_HOME" out
          base64 -d <<<"$STAGING_KEYSTORE_B64" >"$ANDROID_USER_HOME/debug.keystore"
          flutter build apk -t lib/shikoo/app/main.dart --release --split-per-abi --target-platform android-arm,android-arm64,android-x64 \
            --build-name "$VN" --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define=APP_ENV=stable --dart-define=SHIKOO_API="$API" --dart-define=SHIKOO_BOT="$BOT"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            mv "build/app/outputs/flutter-apk/app-$abi-release.apk" "out/ShikooNet-$VN-staging-$abi.apk"
          done

      - name: Production APKs
        if: matrix.flavor == 'production'
        env:
          KEYSTORE_B64: ${{ secrets.SHIKOO_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SHIKOO_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHIKOO_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHIKOO_RELEASE_KEY_PASSWORD }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::no release key yet (SHIKOO_RELEASE_KEYSTORE_B64): staging only, nothing to promote"
            exit 0
          fi
          mkdir -p out
          base64 -d <<<"$KEYSTORE_B64" >android/app/keystore.jks
          printf '\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" >>android/local.properties
          flutter build apk -t lib/shikoo/app/main.dart --release --split-per-abi --target-platform android-arm,android-arm64 \
            --build-name "$VN" --build-number "$GITHUB_RUN_NUMBER" --dart-define=APP_ENV=stable
          for abi in armeabi-v7a arm64-v8a; do
            mv "build/app/outputs/flutter-apk/app-$abi-release.apk" "out/ShikooNet-$VN-$abi.apk"
          done

      - name: Forget the keys
        if: always()
        run: rm -rf android/app/keystore.jks android/local.properties "$RUNNER_TEMP/android-user"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apks-${{ matrix.flavor }}
          path: out/*.apk
          retention-days: 1
          compression-level: 0

  release:
    needs: [commit, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    env:
      SHA: ${{ needs.commit.outputs.sha }}
      VN: ${{ needs.commit.outputs.vn }}
      API: ${{ needs.commit.outputs.api }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.commit.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: apks-*
          merge-multiple: true
          path: out

      - name: Check every APK, and record what was built
        run: |
          set -euo pipefail
          bash tools/check_apk_clean.sh out/*.apk
          tools=("$ANDROID_HOME"/build-tools/*/aapt2) && aapt2=${tools[-1]} && apksigner=${aapt2%aapt2}apksigner
          # build-tools 37 prints "V2 Signer: certificate SHA-256 digest: ..." where 36 printed "Signer #1 certificate ..."
          signer() { "$apksigner" verify --print-certs "$2" | sed -n "s/^.* certificate $1: //p"; }
          for apk in out/*.apk; do
            [ -n "$(signer 'SHA-256 digest' "$apk")" ] ||
              { echo "::error::$apk has no signer digest"; "$apksigner" verify -v --print-certs "$apk"; exit 1; }
          done
          staging_cert=$(for apk in out/*-staging-*.apk; do signer 'SHA-256 digest' "$apk"; done | sort -u)
          staging_dn=$(for apk in out/*-staging-*.apk; do signer DN "$apk"; done | sort -u)
          production_cert=$(for apk in out/ShikooNet-"$VN"-a*.apk; do [ ! -e "$apk" ] || signer 'SHA-256 digest' "$apk"; done | sort -u)
          [ -n "$staging_cert" ] && [ "$(wc -l <<<"$staging_cert")" -eq 1 ] || { echo "::error::staging APKs carry different signers"; exit 1; }
          [ "$staging_dn" = "$STAGING_CERT_DN" ] ||
            { echo "::error::staging APKs are signed by '$staging_dn', not the staging key ($STAGING_CERT_DN)"; exit 1; }
          [ -z "$production_cert" ] || [ "$production_cert" = "$RELEASE_CERT_SHA256" ] ||
            { echo "::error::production APKs are signed by $production_cert, not the release key $RELEASE_CERT_SHA256"; exit 1; }
          for apk in out/*.apk; do
            n=$(unzip -p "$apk" 'lib/*/libapp.so' | grep -caF "$API" || true)
            pkg=$("$aapt2" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            case $apk in
              *-staging-*) [ "$n" -gt 0 ] && [ "$pkg" = "$APP_ID.dev" ] ;;
              *) [ "$n" -eq 0 ] && [ "$pkg" = "$APP_ID" ] ;;
            esac || { echo "::error::$apk is $pkg and carries the staging server $n times"; exit 1; }
          done
          (cd out && sha256sum ./*.apk | sed 's| \./| |' >SHA256SUMS)
          {
            echo "## ShikooNet $VN from \`$SHA\`"
            echo '```'
            cat out/SHA256SUMS
            for apk in out/*.apk; do
              echo "== ${apk#out/}"
              "$aapt2" dump badging "$apk" | grep -E '^(package|minSdkVersion|targetSdkVersion|native-code)|uses-feature.*leanback'
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" >out/NOTES.md

      - name: Staging pre-release
        if: needs.commit.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "staging-$VN" out/*.apk out/SHA256SUMS --prerelease \
            --target "$SHA" --title "ShikooNet $VN (staging)" --notes-file out/NOTES.md

      # the production APKs are signed with the release key; past this job only the pre-release keeps them
      - name: Forget the APKs handed between jobs
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].id' |
            xargs -r -I{} gh api -X DELETE "repos/$GH_REPO/actions/artifacts/{}"

  door:
    needs: [commit, release]
    if: needs.commit.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.commit.outputs.sha }}
          persist-credentials: false

      - name: The staging APKs of this run, to the staging door
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DOOR_TOKEN: ${{ secrets.SHIKOO_STAGING_DOOR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$DOOR_TOKEN" ]; then
            echo "::warning::no staging door yet (SHIKOO_STAGING_DOOR_TOKEN): installed staging apps are not offered this build"
            exit 0
          fi
          vn=$VERSION_PREFIX.$GITHUB_RUN_NUMBER
          gh release download "staging-$vn" --dir door --pattern SHA256SUMS --pattern "ShikooNet-$vn-staging-*.apk"
          grep -E " ShikooNet-$vn-staging-[a-z0-9_-]+\.apk$" door/SHA256SUMS >door/staging.sums
          mv door/staging.sums door/SHA256SUMS
          (cd door && sha256sum -c SHA256SUMS)
          bash tools/publish_door.sh "$STAGING_API" door false
