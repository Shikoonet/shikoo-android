name: Shikoo Staging

on:
  workflow_run:
    workflows: [Shikoo CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shikoo-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.1'
  GO_VERSION: '1.27.3'
  NDK_VERSION: r28c
  VERSION_PREFIX: '1.0'
  APP_ID: com.shikoonet.app
  PRODUCTION_API: https://app.chopon.uk
  PRODUCTION_BOT: shikoonet_bot
  STAGING_API: ${{ vars.SHIKOO_STAGING_API || 'https://app-dev.chopon.uk' }}
  STAGING_BOT: ${{ vars.SHIKOO_STAGING_BOT || 'shikoodevbot' }}
  RELEASE_CERT_SHA256: dbf909bae41e5aaf30e55b345a195e913cff5ae34d6d97d586e1b95b0d9c29de
  STAGING_CERT_DN: CN=ShikooNet Staging

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - id: commit
        name: The commit CI passed on main, merged from a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$REF" != refs/heads/main ]; then
            echo "::error::Shikoo Staging runs from refs/heads/main; this dispatch came from $REF"
            exit 1
          fi
          sha=${RUN_SHA:-$(gh api "repos/$GH_REPO/commits/main" --jq .sha)}
          gh run list --workflow shikoo-ci.yml --commit "$sha" --branch main --event push --status success \
            --json databaseId --jq '.[0].databaseId' | grep -q . ||
            { echo "::error::CI has not passed on $sha as a push to main"; exit 1; }
          [ "$(gh api "repos/$GH_REPO/commits/$sha/pulls" --jq '[.[] | select(.merged_at)] | length')" -gt 0 ] ||
            { echo "::error::$sha came from no merged pull request; a direct push to main is not released"; exit 1; }
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          printf 'SHA=%s\nVN=%s\n' "$sha" "$VERSION_PREFIX.$GITHUB_RUN_NUMBER" >>"$GITHUB_ENV"

      - name: Free disk space, which one cold Android build overruns on a hosted runner (run 37618279233)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/share/swift /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk/*
          sudo docker image prune -af >/dev/null
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.commit.outputs.sha }}
          submodules: recursive
          persist-credentials: false

      - name: The core commit, which Settings shows under «هسته»
        run: echo "CORE=$(git rev-parse --short=7 HEAD:core/Clash.Meta)" >>"$GITHUB_ENV"

      - name: The app takes its server and bot from the build, and staging points away from production
        run: |
          set -euo pipefail
          for key in SHIKOO_API SHIKOO_BOT; do
            grep -rqzP "fromEnvironment\s*\(\s*'$key'" lib/shikoo ||
              { echo "::error::lib/shikoo does not read $key from the build"; exit 1; }
          done
          api=${STAGING_API%/} bot=${STAGING_BOT#@}
          [ "${api,,}" != "${PRODUCTION_API,,}" ] && [ "${bot,,}" != "${PRODUCTION_BOT,,}" ] ||
            { echo "::error::staging must not point at the production server or bot"; exit 1; }
          printf 'API=%s\nBOT=%s\n' "$api" "$bot" >>"$GITHUB_ENV"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      # after setup-go: it copies sing-tun out of the Go module cache
      - run: bash tools/core-patches/apply.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-ca
          path: core/Clash.Meta/component/ca/ca-certificates.crt
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            .dart_tool/hooks_runner
            .dart_tool/setup_build_cache
            libclash
          key: native-go${{ env.GO_VERSION }}-${{ hashFiles('core/**', 'build_config.yaml', 'plugins/setup/**', 'plugins/rust_api/rust/**') }}
          restore-keys: native-go${{ env.GO_VERSION }}-

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - run: flutter pub get

      # no keystore.jks yet, so FlClash's gradle signs with the debug config and adds the .dev suffix
      - name: Staging APKs
        env:
          STAGING_KEYSTORE_B64: ${{ secrets.SHIKOO_STAGING_KEYSTORE_B64 }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          # AGP takes its debug keystore from here first; unset, from $XDG_CONFIG_HOME/.android, which the image sets
          ANDROID_USER_HOME: ${{ runner.temp }}/android-user
        run: |
          set -euo pipefail
          [ -n "$STAGING_KEYSTORE_B64" ] || { echo "::error::set the secret SHIKOO_STAGING_KEYSTORE_B64"; exit 1; }
          mkdir -p "$ANDROID_USER_HOME" out
          base64 -d <<<"$STAGING_KEYSTORE_B64" >"$ANDROID_USER_HOME/debug.keystore"
          flutter build apk -t lib/shikoo/app/main.dart --release --split-per-abi --target-platform android-arm,android-arm64,android-x64 \
            --build-name "$VN" --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define=APP_ENV=stable --dart-define=SHIKOO_API="$API" --dart-define=SHIKOO_BOT="$BOT" \
            --dart-define=SHIKOO_CORE="$CORE"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            mv "build/app/outputs/flutter-apk/app-$abi-release.apk" "out/ShikooNet-$VN-staging-$abi.apk"
          done

      - name: Production APKs
        env:
          KEYSTORE_B64: ${{ secrets.SHIKOO_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SHIKOO_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHIKOO_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHIKOO_RELEASE_KEY_PASSWORD }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::no release key yet (SHIKOO_RELEASE_KEYSTORE_B64): staging only, nothing to promote"
            exit 0
          fi
          base64 -d <<<"$KEYSTORE_B64" >android/app/keystore.jks
          printf '\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" >>android/local.properties
          flutter build apk -t lib/shikoo/app/main.dart --release --split-per-abi --target-platform android-arm,android-arm64 \
            --build-name "$VN" --build-number "$GITHUB_RUN_NUMBER" --dart-define=APP_ENV=stable --dart-define=SHIKOO_CORE="$CORE"
          for abi in armeabi-v7a arm64-v8a; do
            mv "build/app/outputs/flutter-apk/app-$abi-release.apk" "out/ShikooNet-$VN-$abi.apk"
          done

      - name: Forget the keys
        if: always()
        run: rm -rf android/app/keystore.jks android/local.properties "$RUNNER_TEMP/android-user"

      - name: Check every APK, and record what was built
        run: |
          set -euo pipefail
          bash tools/check_apk_clean.sh out/*.apk
          tools=("$ANDROID_HOME"/build-tools/*/aapt2) && aapt2=${tools[-1]} && apksigner=${aapt2%aapt2}apksigner
          # build-tools 37 prints "V2 Signer: certificate SHA-256 digest: ..." where 36 printed "Signer #1 certificate ..."
          signer() { "$apksigner" verify --print-certs "$2" | sed -n "s/^.* certificate $1: //p"; }
          for apk in out/*.apk; do
            [ -n "$(signer 'SHA-256 digest' "$apk")" ] ||
              { echo "::error::$apk has no signer digest"; "$apksigner" verify -v --print-certs "$apk"; exit 1; }
          done
          staging_cert=$(for apk in out/*-staging-*.apk; do signer 'SHA-256 digest' "$apk"; done | sort -u)
          staging_dn=$(for apk in out/*-staging-*.apk; do signer DN "$apk"; done | sort -u)
          production_cert=$(for apk in out/ShikooNet-"$VN"-a*.apk; do [ ! -e "$apk" ] || signer 'SHA-256 digest' "$apk"; done | sort -u)
          [ -n "$staging_cert" ] && [ "$(wc -l <<<"$staging_cert")" -eq 1 ] || { echo "::error::staging APKs carry different signers"; exit 1; }
          [ "$staging_dn" = "$STAGING_CERT_DN" ] ||
            { echo "::error::staging APKs are signed by '$staging_dn', not the staging key ($STAGING_CERT_DN)"; exit 1; }
          [ -z "$production_cert" ] || [ "$production_cert" = "$RELEASE_CERT_SHA256" ] ||
            { echo "::error::production APKs are signed by $production_cert, not the release key $RELEASE_CERT_SHA256"; exit 1; }
          for apk in out/*.apk; do
            n=$(unzip -p "$apk" 'lib/*/libapp.so' | grep -caF "$API" || true)
            pkg=$("$aapt2" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            case $apk in
              *-staging-*) [ "$n" -gt 0 ] && [ "$pkg" = "$APP_ID.dev" ] ;;
              *) [ "$n" -eq 0 ] && [ "$pkg" = "$APP_ID" ] ;;
            esac || { echo "::error::$apk is $pkg and carries the staging server $n times"; exit 1; }
            core=$(git rev-parse --short=7 HEAD:core/Clash.Meta)
            # The diagnostics report names it. The compiler keeps a string past Latin-1 as two-byte,
            # so both widths are searched.
            wide=$(sed 's/./&\\x00/g' <<<"$core")
            [ "$(unzip -p "$apk" 'lib/*/libapp.so' | LC_ALL=C grep -caP "$core|$wide" || true)" -gt 0 ] ||
              { echo "::error::$apk does not name its core commit $core for the diagnostics report"; exit 1; }
          done
          (cd out && sha256sum ./*.apk | sed 's| \./| |' >SHA256SUMS)
          {
            echo "## ShikooNet $VN from \`$SHA\`"
            echo '```'
            cat out/SHA256SUMS
            for apk in out/*.apk; do
              echo "== ${apk#out/}"
              "$aapt2" dump badging "$apk" | grep -E '^(package|minSdkVersion|targetSdkVersion|native-code)|uses-feature.*leanback'
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" >out/NOTES.md

      - name: Staging pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "staging-$VN" out/*.apk out/SHA256SUMS --prerelease \
            --target "$SHA" --title "ShikooNet $VN (staging)" --notes-file out/NOTES.md

  windows:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: LF line endings and long paths before the checkout, so the core's files are byte for byte the Linux job's
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          submodules: recursive
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: core-ca
          path: ${{ runner.temp }}/core-ca

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: The core patches after setup-go, with the very CA roots the Android core got
        env:
          SHIKOO_CA_DIR: ${{ runner.temp }}/core-ca
        run: |
          bash tools/core-patches/apply.sh
          echo "CORE=$(git rev-parse --short=7 HEAD:core/Clash.Meta)" >>"$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            .dart_tool/hooks_runner
            .dart_tool/setup_build_cache
            libclash
          key: native-windows-${{ hashFiles('core/**', 'build_config.yaml', 'plugins/setup/**', 'plugins/rust_api/rust/**', 'services/helper/**') }}
          restore-keys: native-windows-

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: The Rust of plugins/rust_api for the helper too, as tools/windows-toolchain.ps1 sets it
        working-directory: plugins/rust_api/rust
        run: |
          rustup toolchain install
          rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"
          rustc --version

      - name: Inno Setup 6.7.3, as tools/windows-toolchain.ps1 installs it
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\innosetup-6.7.3.exe"
          curl.exe -fsSL --retry 5 -o $exe https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
          if ((Get-FileHash $exe).Hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw 'innosetup-6.7.3.exe: wrong sha256' }
          $p = Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/NOICONS', "/DIR=$env:RUNNER_TEMP\inno" -Wait -PassThru
          if ($p.ExitCode) { throw "Inno Setup installer exit $($p.ExitCode)" }
          "INNO_SETUP_PATH=$env:RUNNER_TEMP\inno" >> $env:GITHUB_ENV

      - name: Staging and production installers
        run: |
          set -euo pipefail
          VN=$VERSION_PREFIX.$GITHUB_RUN_NUMBER API=${STAGING_API%/} BOT=${STAGING_BOT#@} rel=build/windows/x64/runner/Release
          dart pub global activate -s git https://github.com/chen08209/flutter_distributor.git \
            --git-ref v0.6.11-flclash.2 --git-path packages/flutter_distributor
          # Inno's AppVersion is pubspec's version; FlClash's 0.8.98 would show in «Programs and Features»
          sed -i "s/^version: .*/version: $VN/" pubspec.yaml
          mkdir -p out
          package() {
            dart pub global run flutter_distributor:main package --skip-clean --platform windows --targets exe \
              --artifact-name "$1" --build-target lib/shikoo/app/main.dart \
              --flutter-build-args "build-name=$VN,build-number=$GITHUB_RUN_NUMBER" \
              --build-dart-define APP_ENV=stable --build-dart-define SHIKOO_CORE="$CORE" "${@:2}"
            mv "dist/$1" out/
            staging=$(grep -caF "$API" "$rel/data/app.so" || true)
            product=$(pwsh -NoProfile -Command "(Get-Item 'out/$1', '$rel/ShikooNet.exe').VersionInfo.ProductName.Trim() -join ' / '" | tr -d '\r')
            port=$(grep -oaE 'http://127\.0\.0\.1:4789[0-9]' "$rel/data/app.so" | sort -u | paste -sd' ' || true)
            service=$(grep -oaE 'ShikooNet(Test)?HelperService' "$rel/ShikooNetHelperService.exe" | sort -u | paste -sd' ' || true)
            found="installer / app '$product', staging server $staging times, helper '$port', service '$service'"
            echo "$1: $found"
          }
          # Staging needs all three: SHIKOO_FLAVOR for CMake and ISCC, build_config.yaml for the helper, the define for Dart.
          flavor() {
            sed -i "s/^flavor: .*/flavor: $1/" build_config.yaml
            grep -qx "flavor: $1" build_config.yaml ||
              { echo "::error::build_config.yaml has no 'flavor:' line to set to $1, so the helper would keep the other name"; exit 1; }
          }
          export SHIKOO_FLAVOR=staging
          flavor staging
          package "ShikooNet-$VN-staging-windows-x64.exe" --build-dart-define SHIKOO_FLAVOR=staging \
            --build-dart-define SHIKOO_API="$API" --build-dart-define SHIKOO_BOT="$BOT"
          [[ $product == 'ShikooNet Test / ShikooNet Test' && $staging -gt 0 && $port == http://127.0.0.1:47892 &&
            $service == ShikooNetTestHelperService ]] ||
            { echo "::error::the staging build is not the test one: $found"; exit 1; }
          unset SHIKOO_FLAVOR
          flavor production
          package "ShikooNet-$VN-windows-x64.exe"
          [[ $product == 'ShikooNet / ShikooNet' && $staging -eq 0 && $port == http://127.0.0.1:47891 &&
            $service == ShikooNetHelperService ]] ||
            { echo "::error::the production build is not the production one: $found"; exit 1; }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers
          path: out/*.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  seal:
    needs: [build, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installers
          path: out

      - name: Seal each installer with its Android key, whose public half the app must hold
        env:
          STAGING_KEYSTORE_B64: ${{ secrets.SHIKOO_STAGING_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_B64: ${{ secrets.SHIKOO_RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.SHIKOO_RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          keys=$RUNNER_TEMP/seal && trap 'rm -rf "$keys"' EXIT
          (umask 077 && mkdir "$keys")
          seal() {
            local exe=out/$1 want have
            want=$(grep -zoP "const windowsSealKey$2\s*=\s*'\K[A-Za-z0-9+/]+=*(?=';)" lib/shikoo/engine/update.dart | tr -d '\0' || true)
            [ -n "$want" ] || { echo "::error::lib/shikoo/engine/update.dart holds no windowsSealKey$2 = '<base64>'"; exit 1; }
            [ -n "$3" ] || { echo "::error::the keystore for $1 is not in the secrets"; exit 1; }
            base64 -d <<<"$3" >"$keys/keystore.p12"
            KEY_PASS=$4 openssl pkcs12 -in "$keys/keystore.p12" -passin env:KEY_PASS -nocerts -nodes -out "$keys/key.pem"
            openssl pkey -in "$keys/key.pem" -pubout -out "$keys/public.pem"
            have=$(openssl pkey -pubin -in "$keys/public.pem" -outform DER | base64 -w0)
            [ "$have" = "$want" ] || { echo "::error::the key for $1 is not the one windowsSealKey$2 names"; exit 1; }
            printf 'shikoonet-windows-update:%s:%s' "$GITHUB_RUN_NUMBER" "$(sha256sum "$exe" | cut -c1-64)" >"$keys/message"
            openssl dgst -sha256 -sign "$keys/key.pem" -out "$keys/seal" "$keys/message"
            openssl dgst -sha256 -verify "$keys/public.pem" -signature "$keys/seal" "$keys/message"
            { base64 -w0 "$keys/seal"; echo; } >"$exe.sig"
            rm -f "$keys"/*
          }
          VN=$VERSION_PREFIX.$GITHUB_RUN_NUMBER
          seal "ShikooNet-$VN-staging-windows-x64.exe" Staging "$STAGING_KEYSTORE_B64" android
          seal "ShikooNet-$VN-windows-x64.exe" Production "$RELEASE_KEYSTORE_B64" "$RELEASE_STORE_PASSWORD"
          echo "VN=$VN" >>"$GITHUB_ENV"

      - name: Installers, seals and their sums into the staging pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download "staging-$VN" --dir sums --pattern SHA256SUMS
          grep -v 'windows-x64\.exe$' sums/SHA256SUMS >sums/new || true
          for exe in out/*.exe; do printf '%s  %s\n' "$(sha256sum -b "$exe" | cut -c1-64)" "${exe#out/}"; done |
            tee -a "$GITHUB_STEP_SUMMARY" >>sums/new
          mv sums/new sums/SHA256SUMS
          gh release upload "staging-$VN" out/* --clobber
          gh release upload "staging-$VN" sums/SHA256SUMS --clobber

  door:
    needs: [build, seal]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false

      - name: The staging APKs and Windows installer of this run, to the staging door
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DOOR_TOKEN: ${{ secrets.SHIKOO_STAGING_DOOR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$DOOR_TOKEN" ]; then
            echo "::warning::no staging door yet (SHIKOO_STAGING_DOOR_TOKEN): installed staging apps are not offered this build"
            exit 0
          fi
          vn=$VERSION_PREFIX.$GITHUB_RUN_NUMBER
          gh release download "staging-$vn" --dir door --pattern SHA256SUMS --pattern "ShikooNet-$vn-staging-*"
          grep -E " ShikooNet-$vn-staging-[a-z0-9_-]+\.(apk|exe)$" door/SHA256SUMS >door/staging.sums
          mv door/staging.sums door/SHA256SUMS
          grep -q 'windows-x64\.exe$' door/SHA256SUMS ||
            echo "::warning::no Windows installer in staging-$vn: the staging door keeps its previous one"
          (cd door && sha256sum -c SHA256SUMS)
          bash tools/publish_door.sh "$STAGING_API" door false
