name: Shikoo CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: '3.47.1'
  GO_VERSION: '1.27.3'
  NDK_VERSION: r28c

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # upstream/* branches merge FlClash itself, whose commits and comments are not ours to police
      - name: Commit messages
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'upstream/')
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for c in $(git rev-list "$BASE..$HEAD"); do
            git log -1 --format=%B "$c" >"$RUNNER_TEMP/msg"
            bash tool/check_commit_msg.sh "$RUNNER_TEMP/msg" || { echo "::error::commit $c"; exit 1; }
          done

      - name: Comment density
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'upstream/')
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git reset -q --soft "$BASE"
          git diff --cached --name-only -z --diff-filter=AM | xargs -0 -r bash tool/check_comment_density.sh

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - run: dart format --output=none --set-exit-if-changed lib test tool plugins setup.dart

      - run: flutter analyze --no-fatal-infos

      - name: Tests
        if: github.event_name == 'push' || !github.event.pull_request.draft
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml
          flutter test --reporter expanded

      # The runner keeps UTC, where a clock that skips the device's own zone still reads right.
      - name: Tests, Logs page in Tehran time
        if: github.event_name == 'push' || !github.event.pull_request.draft
        run: TZ=Asia/Tehran flutter test test/shikoo/logs_test.dart

      - name: Tests, staging names
        if: github.event_name == 'push' || !github.event.pull_request.draft
        run: flutter test test/shikoo/windows_names_test.dart --dart-define=SHIKOO_FLAVOR=staging

  apk:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Free disk space, which one cold Android build overruns on a hosted runner (run 37618279233)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/share/swift /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk/*
          sudo docker image prune -af >/dev/null
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      # after setup-go: it copies sing-tun out of the Go module cache
      - run: bash tools/core-patches/apply.sh

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            .dart_tool/hooks_runner
            .dart_tool/setup_build_cache
            libclash
          key: native-go${{ env.GO_VERSION }}-${{ hashFiles('core/**', 'build_config.yaml', 'plugins/setup/**', 'plugins/rust_api/rust/**') }}
          restore-keys: native-go${{ env.GO_VERSION }}-

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - run: flutter pub get

      - run: |
          flutter build apk -t lib/shikoo/app/main.dart --release --split-per-abi --target-platform android-arm --dart-define=APP_ENV=stable \
            --dart-define=SHIKOO_CORE="$(git rev-parse --short=7 HEAD:core/Clash.Meta)"
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}

      - run: bash tools/check_apk_clean.sh build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
