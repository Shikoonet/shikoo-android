name: Shikoo Promote

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Publish the production APKs that staging built from current main?
        required: true
        type: choice
        default: 'no'
        options: ['no', PROMOTE]
      force:
        description: Force the update? Every installed version older than this one must update before it can be used.
        required: true
        type: choice
        default: 'no'
        options: ['no', 'yes']

permissions:
  contents: read

concurrency:
  group: shikoo-release
  cancel-in-progress: false

env:
  PROMOTE_OWNERS: Isusami,arshiajacki
  PRODUCTION_API: https://app.chopon.uk

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: From main, by an owner, on purpose
        env:
          REF: ${{ github.ref }}
          CONFIRM: ${{ inputs.confirm }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          [ "$REF" = refs/heads/main ] || { echo "::error::promote runs from main, not $REF"; exit 1; }
          [ "$CONFIRM" = PROMOTE ] || { echo "::error::choose PROMOTE to publish"; exit 1; }
          [[ ",$PROMOTE_OWNERS," == *",$ACTOR,"* ]] || { echo "::error::@$ACTOR may not promote"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The production APKs staging built from current main
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          tag=$(gh api "repos/$GH_REPO/releases?per_page=100" --jq "[.[] | select(.prerelease
            and (.tag_name | startswith(\"staging-\")) and .target_commitish == \"$sha\")][0].tag_name // empty")
          [ -n "$tag" ] || { echo "::error::staging has not built main ($sha)"; exit 1; }
          [ "$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)" = "$sha" ] ||
            { echo "::error::$tag does not point at $sha"; exit 1; }
          vn=${tag#staging-}
          mkdir staged out
          gh release download "$tag" --dir staged --pattern SHA256SUMS \
            --pattern "ShikooNet-$vn-armeabi-v7a.apk" --pattern "ShikooNet-$vn-arm64-v8a.apk"
          grep -E " ShikooNet-$vn-(armeabi-v7a|arm64-v8a)\.apk$" staged/SHA256SUMS >out/SHA256SUMS
          [ "$(wc -l <out/SHA256SUMS)" -eq 2 ] || { echo "::error::$tag holds no production APKs"; exit 1; }
          (cd staged && sha256sum -c ../out/SHA256SUMS)
          mv staged/ShikooNet-*.apk out/
          printf 'SHA=%s\nTAG=%s\nVN=%s\n' "$sha" "$tag" "$vn" >>"$GITHUB_ENV"

      - name: The production door, before anything is published
        env:
          DOOR_TOKEN: ${{ secrets.SHIKOO_PRODUCTION_DOOR_TOKEN }}
          FORCE: ${{ inputs.force == 'yes' }}
        run: |
          set -euo pipefail
          [ -n "$DOOR_TOKEN" ] ||
            { echo "::error::set the secret SHIKOO_PRODUCTION_DOOR_TOKEN, the production door's RELEASE_TOKEN; nothing was published"; exit 1; }
          bash tools/publish_door.sh "$PRODUCTION_API" out "$FORCE"

      - name: Publish
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          { echo "Promoted from $TAG (commit $SHA) by @$GITHUB_ACTOR. Same bytes, no rebuild. Forced update: $FORCE."
            echo '```'; cat out/SHA256SUMS; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY" >notes.md
          gh release create "v$VN" out/*.apk out/SHA256SUMS --target "$SHA" --title "ShikooNet $VN" --notes-file notes.md
