    <p class="note">ترتیب ریموت در ستون کارت، از بالا به پایین: «به‌روزرسانی»، «تمدید» و «پشتیبانی»، «پینگ همه»، سرورها. از دکمهٔ گرد، فلشِ رو به کارت به سرورِ انتخاب‌شده می‌رود؛ از هر جای ستون، فلشِ رو به دکمهٔ گرد برمی‌گردد؛ از «به‌روزرسانی»، بالا به «تنظیمات».</p>
