    <p class="note">ریموت مثل همیشه اول روی دکمهٔ گرد است. به‌روزرسانی در پس‌زمینه است و فوکوس را نمی‌گیرد؛ پینگ خودکار نیست، پس فهرست به ترتیب پنل و بی‌عدد است و سربرگش می‌گوید با «پینگ» مرتب می‌شود. تا پایانِ به‌روزرسانی «پینگ» کم‌رنگ است و ریموت رویش نمی‌ایستد. دکمهٔ گرد از لحظهٔ اول با سرورِ انتخاب‌شده وصل می‌شود.</p>
    <p class="note">به‌روزرسانی با اجرای تازه یا برگشتن به اپ است، اگر بیش از ۱۰ دقیقه از آخرین به‌روزرسانیِ موفق گذشته باشد.</p>
    <p class="note">ترتیب ریموت، از دکمهٔ گرد: بالا «تنظیمات»؛ فلشِ رو به کارت (راست) سرورِ انتخاب‌شده، و اگر هنوز انتخاب نشده، اولین سرور؛ پایین و چپ هیچ.</p>
    <p class="note">سربرگ کارت دو ایستگاه دارد: «به‌روزرسانی» و، رو به دکمهٔ گرد، «پینگ». ستون از بالا به پایین: این دو، «تمدید» و «پشتیبانی»، سرورها. بالا: از «تمدید» و «پشتیبانی» به «پینگ»، از هر دو دکمهٔ سربرگ به «تنظیمات»، از اولین سرور به «پشتیبانی». پایین: از هر دو دکمهٔ سربرگ به «پشتیبانی»، از «تمدید» و «پشتیبانی» به اولین سرور.</p>
    <p class="note">فلشِ رو به دکمهٔ گرد (چپ): از «به‌روزرسانی» به «پینگ»، از «تمدید» به «پشتیبانی»، و از «پینگ»، «پشتیبانی» و هر سرور به دکمهٔ گرد. فلش راست برعکس، و از «به‌روزرسانی» و «تمدید» هیچ.</p>
</figure>

    <p class="note">تا سروری انتخاب نشده، قرص یک جملهٔ ساکن است، بی‌چرخنده: «سرور خودکار انتخاب می‌شود». هیچ ردیفی تیک ندارد. با دکمهٔ وسط، اپ همان لحظه می‌سنجد و به اولین سروری که جواب بدهد وصل می‌شود (قاب بعدی)؛ با «پینگ»، بعد از پینگ سریع‌ترین انتخاب می‌شود.</p>
    <p class="note">همین قرص وقتی هم می‌آید که به‌روزرسانی سرورِ انتخاب‌شده را حذف کند و از پینگِ قبلی عددی در دست نباشد. رفتن به سرویس دیگر پینگ نمی‌گیرد: اگر آن سرویس قبلاً سروری داشته همان می‌ماند، وگرنه همین قرص.</p>
    <p class="note">اپ هرگز ردیف اول را کورکورانه برنمی‌دارد، چون در اشتراک واقعی ردیف اول ردیف نسخه است. فلشِ رو به کارت از دکمهٔ گرد به اولین سرور می‌رود.</p>
    <p class="note"><b>پیشنهاد</b>ردیف‌هایی که سرور نیستند، مثل ردیف نسخه و «قبل از اتصال به‌روزرسانی کنید» که پنل برای اپ‌های عمومی می‌فرستد، در فهرست نمی‌آیند. اگر پنل حرفی برای مشتری دارد، جایش خط اطلاعیهٔ کارت است. این‌که اپ آن‌ها را چطور بشناسد، با برنامه‌نویس و پنل است.</p>

    <p class="note">اگر سرورِ فعلی در حالت وصل از اشتراک حذف شود، اپ همان لحظه سریع‌ترین سرورِ زنده را، با آخرین پینگ‌ها، انتخاب می‌کند و اتصال به آن می‌رود. پیام همین را می‌گوید و زیر دکمهٔ گرد سرور تازه است.</p>
    <p class="note">اتصال‌های باز، مثل یک ویدیوی در حال پخش، یک لحظه از نو ساخته می‌شوند. زمان‌سنج ادامه می‌دهد، چون دستگاه وصل مانده است.</p>
    <p class="note">پیام‌های خبری (سرور تازه، سرور حذف‌شده، رفتن اتصال به سرور دیگر) تا رفتن اپ به پس‌زمینه یا به‌روزرسانیِ بعدی می‌مانند، نه با زمان‌سنج: رفتنِ ناگهانی‌شان کارت را کوتاه می‌کند و ردیفِ زیر ریموت را جابه‌جا می‌کند. پیام «به‌روز نشد» تا تلاش موفقِ بعدی می‌ماند.</p>
    <p class="note">اگر وصل نبود، سریع‌ترینِ زنده از آخرین پینگ جایش انتخاب می‌شود و پیامِ «جایش انتخاب شد» می‌آید (قاب سربرگ‌های گوشی). اگر هنوز پینگی گرفته نشده، انتخاب پاک می‌شود و قرص «سرور خودکار انتخاب می‌شود» است؛ اگر وصل بود، اپ مثل دکمهٔ وسط می‌سنجد و اتصال به اولین جواب می‌رود.</p>
