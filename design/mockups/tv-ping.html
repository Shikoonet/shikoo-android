    <p class="note">ریموت مثل همیشه اول روی دکمهٔ گرد است. به‌روزرسانی و پینگ در پس‌زمینه‌اند و فوکوس را نمی‌گیرند. اگر سرورِ انتخاب‌شده هنوز در فهرست است، دکمهٔ گرد از لحظهٔ اول با همان وصل می‌شود؛ اگر نیست، قاب بعدی. به‌روزرسانی با اجرای تازه یا برگشتن به اپ است، اگر بیش از ۱۰ دقیقه از آخرین به‌روزرسانیِ موفق گذشته باشد.</p>
    <p class="note">ترتیب ریموت، از دکمهٔ گرد: بالا «تنظیمات»؛ فلشِ رو به کارت (راست) سرورِ انتخاب‌شده، و اگر هنوز انتخاب نشده، اولین سرور؛ پایین و چپ هیچ.</p>
    <p class="note">ستون کارت از بالا به پایین: «به‌روزرسانی»، «تمدید» و «پشتیبانی»، «پینگ همه»، سرورها. بالا: از «تمدید» و «پشتیبانی» به «به‌روزرسانی»، از «به‌روزرسانی» به «تنظیمات»، از «پینگ همه» به «پشتیبانی»، از اولین سرور به «پینگ همه». پایین: از «به‌روزرسانی» به «پشتیبانی»، از «تمدید» و «پشتیبانی» به «پینگ همه»، از «پینگ همه» به اولین سرور.</p>
    <p class="note">فلشِ رو به دکمهٔ گرد (چپ): از «تمدید» اول به «پشتیبانی»، و از «پشتیبانی»، «به‌روزرسانی»، «پینگ همه» و هر سرور به دکمهٔ گرد. فلش راست از «پشتیبانی» به «تمدید»، و از «تمدید» هیچ.</p>

    <p class="note">تا سرور معتبری انتخاب نشده، قرص «در حال یافتن بهترین سرور…» است و هیچ ردیفی تیک ندارد. با پایان سنجش، سریع‌ترین انتخاب و قرص پر می‌شود. اپ هرگز ردیف اول را کورکورانه برنمی‌دارد، چون در اشتراک واقعی ردیف اول ردیف نسخه است.</p>
    <p class="note">همین حالت برای وقتی هم هست که سرورِ انتخاب‌شده را خودِ اپ برگزیده بود و در دورِ تازه بی‌پاسخ شد: اپ آن را کنار می‌گذارد و دوباره دنبال بهترین سرور می‌گردد، تا هیچ‌وقت «وصل» روی سروری مرده نشان ندهد. سروری که خودِ کاربر برگزیده عوض نمی‌شود.</p>
    <p class="note">رفتن به سرویس دیگر بی‌پیام است. اگر سرورِ قبلیِ آن سرویس هنوز جواب می‌دهد، همان می‌ماند. اگر آن را خودِ اپ برگزیده بود و حالا جواب نمی‌دهد، قرص تا پایان دور «در حال یافتن بهترین سرور…» است و بعد سریع‌ترین انتخاب می‌شود. پیامِ «جواب نداد» فقط برای سروری است که مشتری همین حالا روی همین سرویس دیده؛ روی شبکهٔ کند، نبودنِ جواب هم همیشه یعنی مرده بودنِ سرور نیست.</p>
    <p class="note"><b>پیشنهاد</b>پیامش دو جمله است. اولی ««فنلاند ۲» جواب نداد.» و دومی بسته به حال اتصال: اگر قطع است «سریع‌ترین سرور، «آلمان ۲»، جایش انتخاب شد.» و اگر وصل است «اتصال همان لحظه به سریع‌ترین سرور، «آلمان ۲»، رفت.» در حالت قطع «اتصال … رفت» نمی‌آید، چون اتصالی نیست.</p>
    <p class="note">این فاصله دست‌کم ۸ تا ۱۶ ثانیه است و ریموت در همین مدت روی دکمهٔ گرد است؛ پس زدنِ دکمهٔ وسط باید امن باشد (قاب بعدی). فلشِ رو به کارت به اولین سرور می‌رود.</p>
    <p class="note"><b>پیشنهاد</b>ردیف‌هایی که سرور نیستند، مثل ردیف نسخه و «قبل از اتصال به‌روزرسانی کنید» که پنل برای اپ‌های عمومی می‌فرستد، در فهرست نمی‌آیند. اگر پنل حرفی برای مشتری دارد، جایش خط اطلاعیهٔ کارت است. این‌که اپ آن‌ها را چطور بشناسد، با برنامه‌نویس و پنل است.</p>
