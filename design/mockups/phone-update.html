    <p class="note">کارتِ نسخهٔ تازه سرِ فهرست کارت‌هاست، زیر دکمهٔ گرد؛ دکمهٔ گرد و سرورِ زیرش هیچ‌وقت جابه‌جا نمی‌شوند. اعلانِ سیستمی ندارد.</p>
    <p class="note">فقط وقتی هست که نسخهٔ این دستگاه از نسخهٔ منتشرشده کهنه‌تر است. دریافت فقط با زدن «دریافت» شروع می‌شود، چون فایل ۵۲ مگابایت است و شاید اینترنتِ حجمی باشد.</p>
    <p class="note">کارت دکمهٔ بستن ندارد: تا نسخهٔ تازه نصب نشده، سر جایش می‌ماند.</p>

        <div class="update-row"><span class="t"><strong>جا کم است.</strong><small>چند برنامه یا فایل را از این دستگاه پاک کن و دوباره بزن.</small></span><button class="btn btn-outline" type="button">دوباره</button></div>

        <div class="update-row"><span class="t"><strong>آمادهٔ نصب</strong><small>با نصب، شیکونت بسته می‌شود و اگر وصلی، اتصال هم؛ بعد دوباره بازش کن.</small></span><button class="btn btn-primary" type="button">نصب</button></div>

    <p class="note">از بالا: هست، در حال دریافت، آماده، دریافت نشد، فایل سالم نرسید، جا کم است، و «آماده» وقتی نصب‌کننده باز نشد. همین‌ها روی تلویزیون هم هست.</p>
    <p class="note">«جا کم است» وقتی است که فایل در حافظهٔ دستگاه جا نمی‌شود. متنش برای گوشی و تلویزیون یکی است و از اینترنت حرفی نمی‌زند. «دوباره» از همان‌جا ادامه می‌دهد.</p>
    <p class="note">اگر نصب‌کنندهٔ اندروید باز نشد، کارت همان «آماده» می‌ماند و فقط یک خط قرمز زیر «نصب» می‌آید؛ حالت تازه‌ای نیست. «نصب» ِ بعدی خط را برمی‌دارد. در صفحهٔ اجباری همین خط بالای دکمه‌هاست (قاب «نصب‌کننده باز نشد»).</p>
    <p class="note">«انصراف» دریافت را نگه می‌دارد و کارت به حالت اول برمی‌گردد؛ «دریافت» ِ بعدی از همان‌جا ادامه می‌دهد. روی تلویزیون، «انصراف» جای ریموت هم هست، تا وسط دریافت فوکوس جایی برود.</p>
    <p class="note">«دریافت نشد» یعنی اینترنت یا سرور وسط راه قطع شد؛ «دوباره» از همان‌جا ادامه می‌دهد. «فایل سالم نرسید» یعنی فایلِ کامل با نشانِ منتشرشده نخواند؛ فایل پاک می‌شود و «دوباره» از اول می‌گیرد.</p>
    <p class="note">حالتِ «در حال نصب» نداریم: «نصب» نصب‌کنندهٔ خودِ اندروید را باز می‌کند و اپ بسته می‌شود.</p>

    <p class="note">خط وضعیتِ اتصال ندارد. اتصالی که از قبل روشن بوده روشن می‌ماند، ولی از این صفحه کاری با آن نمی‌شود کرد، و نشانِ کلیدِ نوار وضعیتِ اندروید همین را می‌گوید. جملهٔ دوم فقط می‌گوید نصب چه می‌کند.</p>
    <p class="note">دکمهٔ برگشت این صفحه را نمی‌بندد؛ اپ را به پس‌زمینه می‌برد.</p>
