  <p>فقط چیدمان و جریان. رنگ‌ها موقت‌اند تا نظام طراحی شیکو برسد.</p>

<main class="board">

  <!-- ورود -->
  <figure class="shot">
    <figcaption>ورود · هنوز سرویسی نیست</figcaption>
    <div class="phone" data-frame="phone-login">
      <div class="statusbar"><span>۱۲:۴۰</span><svg><use href="#sb"/></svg></div>
      <div class="login">
        <div class="segmented sm" role="radiogroup" aria-label="زبان">
          <button type="button" role="radio" aria-checked="true">فارسی</button>
          <button type="button" role="radio" aria-checked="false" lang="en">English</button>
        </div>
        <div class="login-brand">
          <span class="mark">ش</span>
          <span class="word">شیکونت</span>
          <span class="sub">مخصوص مشتری‌های شیکونت</span>
        </div>
        <button class="btn btn-telegram" type="button"><svg class="icon"><use href="#i-plane"/></svg>ورود با تلگرام</button>
        <p class="login-note">تلگرام باز می‌شود؛ در ربات شیکونت «تأیید» را بزن.</p>
        <button class="btn btn-outline" type="button"><svg class="icon"><use href="#i-paste"/></svg>چسباندن لینک اشتراک</button>
        <button class="btn-link" type="button">تلگرام روی این گوشی نیست؟</button>
      </div>
      <div class="gesture"></div>
    </div>
    <p class="note">زبان کوچک و در گوشه است، تا کسی که فارسی نمی‌خواند پیش از ورود اپ را انگلیسی کند. هر زبان به خط خودش است و انتخابش در تنظیمات هم همان می‌ماند.</p>
    <p class="note">کار اصلی «ورود با تلگرام» است، به رنگ آبی خود تلگرام، نه رنگ شیکو. «چسباندن لینک اشتراک» دکمهٔ دوم است و فقط روی گوشی هست؛ تلویزیون فقط کد تصویری دارد.</p>
    <p class="note">ورود: اپ از سرور یک کد ۶ رقمی می‌گیرد و ربات شیکونت را با همان کد باز می‌کند. کد ۱۰ دقیقه کار می‌کند. اگر کاربر بی‌تأیید برگردد، قاب «برگشت از تلگرام» در حالت‌های گوشی.</p>
    <p class="note">چسباندن: کلیپ‌بورد فقط با زدن همین دکمه خوانده می‌شود، هرگز خودکار. اندروید ۱۲ به بالا همان لحظه پیام کوچک خودش را نشان می‌دهد و این طبیعی است. بعد از زدن، همین دکمه چرخنده و «در حال بررسی لینک…» می‌گیرد و دو دکمهٔ دیگر تا جواب غیرفعال‌اند. خطاها در حالت‌های گوشی.</p>
    <p class="note">فقط لینک اشتراک شیکونت پذیرفته می‌شود، از ربات یا از پنل نماینده. لینک هیچ‌جا روی صفحه یا در گزارش اپ نمی‌آید، حتی در پیام خطا.</p>
    <p class="note">تا سرورِ ورود آماده شود، به‌جای این صفحه خانهٔ بی‌سرویس می‌آید، با «چسباندن لینک اشتراک» و «پشتیبانی» (قاب «خانه · سرویسی روی گوشی نیست» در حالت‌های گوشی).</p>
  </figure>

    <p class="note">«وارد شده با» نامِ نمایشیِ حساب تلگرام است و دکمه نیست. زیرش نام کاربریِ تلگرام می‌آید، چون نام نمایشی یکتا نیست؛ اگر حساب نام کاربری ندارد، فقط «حساب تلگرام». اگر سرویس‌ها با چسباندن لینک آمده باشند، این بخش شکل دیگری دارد (قاب «تنظیمات · با لینک چسبانده‌شده» در حالت‌های گوشی).</p>

        </header>

        <div class="actions">
          <button class="btn btn-primary" type="button"><svg class="icon"><use href="#i-plane"/></svg>باز کردن ربات</button>
        </div>
      </article>
    </div>
    <p class="note">نام سرویس مثل فهرست «سرویس‌های من» در ربات است: نام کاربری · رده. سرویسی که هنوز حساب ندارد، مثل ربات نام پلن را نشان می‌دهد. اگر پنل هیچ نامی نفرستد، «سرویس شیکونت».</p>
    <p class="note">کارتِ کاملِ تمام‌شده فقط وقتی هست که هیچ سرویسی وصل نمی‌شود، و فقط برای اولینِ آن‌ها به ترتیب تاریخ پایان؛ بقیه در ردیف «سرویس‌های تمام‌شده»‌اند (قاب‌های گوشیِ کوچک). ترتیب همین قاب است: اول کارت کاملِ تمام‌شده، بعد «بدون لینک» و «لینک باطل شده»، بعد آن ردیف. هر کارتِ تمام‌شده «تمدید» و «پشتیبانی» دارد. وقتی سرویس فقط از حساب تلگرام آمده و تاریخ پایانش در دست نیست، متن «اعتبارش تمام شد. با تمدید دوباره فعال می‌شود.» است و برای حجم همان «حجمش تمام شد…». دکمهٔ گرد مثل قاب‌های «حجم تمام شده» و «اعتبار تمام شده» است، نه متن برچسب کارت.</p>
    <p class="note">گوشی «دوباره» ندارد و با برگشتن به اپ خودش فهرست را می‌گیرد. تلویزیون کنار «تمدید» و «پشتیبانی»، «دوباره» هم دارد و متنش می‌گوید «بعد از تمدید، «دوباره» را بزن.».</p>
    <p class="note"><b>پیشنهاد</b>دکمهٔ «باز کردن ربات» به یک پیوند مستقیم به ربات (و شاید به همین سرویس) نیاز دارد که هنوز ساخته نشده.</p>
  </figure>
