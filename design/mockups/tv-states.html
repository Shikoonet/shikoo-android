<header class="sheet-head">
  <h1>شیکو · حالت‌های تلویزیون</h1>
  <p>فوکوس ریموت، فهرست بلند و چند سرویس، کد تصویریِ تمدید و پشتیبانی، تنظیمات، و ورود: کد تمام‌شده، تأیید، رد.</p>
  <nav class="sheet-nav">
    <a href="phone.html">گوشی</a>
    <a href="phone-states.html">حالت‌های گوشی</a>
    <a href="tv.html">تلویزیون</a>
    <a href="tv-states.html" aria-current="page">حالت‌های تلویزیون</a>
  </nav>
  <button class="theme-toggle" type="button" onclick="toggleTheme()">روشن / تیره</button>
</header>

<main class="board tv-board">

  <!-- خانه: فوکوس اول روی دکمهٔ گرد -->

        <section class="tv-power">

  <figure class="shot">
    <figcaption>ورود · در تلگرام «رد» زده شد</figcaption>
    <div class="tv" data-device="tv" data-frame="tv-login-rejected">
      <header class="tv-top">
        <div class="brand"><span class="mark">ش</span><span>شیکو</span></div>
      </header>
      <div class="tv-result">
        <span class="hero-icon danger"><svg class="icon"><use href="#i-x"/></svg></span>
        <h1>ورود رد شد</h1>
        <p>در تلگرام «رد» زده شد، پس این تلویزیون وصل نشد. اگر اشتباهی بود، دوباره امتحان کن.</p>
        <button class="btn btn-primary is-focused" type="button"><svg class="icon"><use href="#i-refresh"/></svg>کد تازه</button>
      </div>
    </div>
    <p class="note"><b>پیشنهاد</b>به سمت سرورِ ورود بستگی دارد که هنوز ساخته نشده.</p>
  </figure>

  <!-- نمونهٔ فوکوس اجزا -->
  <figure class="shot">
    <figcaption>نمونهٔ اجزا · شکل فوکوس ریموت (این صفحهٔ اپ نیست)</figcaption>
    <div class="tv spec-frame" data-device="tv" data-frame="tv-focus-board">
      <div class="spec-grid">
        <div class="spec">
          <div class="power-ring">
            <button class="power is-focused" type="button">
              <svg class="icon"><use href="#i-power"/></svg>
              <span class="power-label">اتصال</span>
            </button>
          </div>
          <p class="spec-cap"><strong>دکمهٔ گرد</strong>فوکوس اولِ خانه</p>
        </div>
        <div class="spec">
          <button class="btn btn-primary is-focused" type="button"><svg class="icon"><use href="#i-qr"/></svg>تمدید</button>
          <p class="spec-cap"><strong>«تمدید»</strong>دکمهٔ پُر</p>
        </div>
        <div class="spec">
          <button class="btn btn-outline is-focused" type="button"><svg class="icon"><use href="#i-qr"/></svg>پشتیبانی</button>
          <p class="spec-cap"><strong>«پشتیبانی»</strong>دکمهٔ دورخط‌دار</p>
        </div>
        <div class="spec">
          <button class="btn btn-outline is-focused" type="button"><svg class="icon"><use href="#i-gear"/></svg>تنظیمات</button>
          <p class="spec-cap"><strong>«تنظیمات»</strong>بالای صفحه</p>
        </div>
        <div class="spec-row">
          <div class="card">
            <ul class="servers">
              <li class="server is-selected"><svg class="flag"><use href="#f-de"/></svg><span class="name">آلمان ۲<bdi class="proto">V2Ray</bdi></span><span class="ping">۸۴ <span class="unit">ms</span></span><svg class="icon tick"><use href="#i-check"/></svg></li>
              <li class="server is-focused"><svg class="flag"><use href="#f-fi"/></svg><span class="name">فنلاند ۲<bdi class="proto">V2Ray</bdi></span><span class="ping">۱۱۲ <span class="unit">ms</span></span><svg class="icon tick"><use href="#i-check"/></svg></li>
              <li class="server is-selected is-focused"><svg class="flag"><use href="#f-nl"/></svg><span class="name">هلند ۱<bdi class="proto">V2Ray</bdi></span><span class="ping">۹۶ <span class="unit">ms</span></span><svg class="icon tick"><use href="#i-check"/></svg></li>
            </ul>
          </div>
          <div class="spec-legend">
            <p class="spec-cap"><strong>انتخاب‌شده</strong>نوار سبز و تیک</p>
            <p class="spec-cap"><strong>فوکوس ریموت</strong>حلقهٔ ضخیم و سطح روشن</p>
            <p class="spec-cap"><strong>هر دو</strong>نوار و حلقه با هم</p>
          </div>
        </div>
      </div>
    </div>
    <p class="note">حلقهٔ فوکوس همیشه یک رنگ است (سیاه در روشن، سفید در تیره) و به رنگ برند وابسته نیست.</p>
  </figure>

  <!-- حالت‌های دکمهٔ گرد روی تلویزیون -->
  <figure class="shot">
    <figcaption>نمونهٔ اجزا · دکمهٔ گرد روی تلویزیون (این صفحهٔ اپ نیست)</figcaption>
    <div class="tv spec-frame" data-device="tv" data-frame="tv-power-states">
      <div class="spec-grid">
        <div class="spec is-connecting">
          <div class="power-ring">
            <svg class="arc" viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="48" pathLength="100"/><circle class="head" cx="50" cy="50" r="48" pathLength="100" stroke-dasharray="28 72"/></svg>
            <button class="power is-focused" type="button">
              <svg class="icon"><use href="#i-power"/></svg>
              <span class="power-label">در حال اتصال…</span>
              <span class="power-sub">دکمهٔ وسط: لغو</span>
            </button>
          </div>
          <p class="spec-cap"><strong>در حال اتصال</strong>فوکوس روی دکمه می‌ماند</p>
        </div>
        <div class="spec is-error">
          <div class="power-ring">
            <button class="power is-focused" type="button">
              <svg class="icon"><use href="#i-alert"/></svg>
              <span class="power-label">وصل نشد</span>
              <span class="power-sub">دکمهٔ وسط: دوباره</span>
            </button>
          </div>
          <p class="spec-cap"><strong>وصل نشد</strong>فوکوس روی دکمه می‌ماند</p>
        </div>
        <div class="spec is-disabled">
          <div class="power-ring">
            <div class="power" aria-disabled="true">
              <svg class="icon"><use href="#i-power"/></svg>
              <span class="power-label">حجم تمام شده</span>
            </div>
          </div>
          <p class="spec-cap"><strong>حجم تمام شده</strong>فوکوس اول به «تمدید» می‌رود</p>
        </div>
        <div class="spec is-disabled">
          <div class="power-ring">
            <div class="power" aria-disabled="true">
              <svg class="icon"><use href="#i-power"/></svg>
              <span class="power-label">اعتبار تمام شده</span>
            </div>
          </div>
          <p class="spec-cap"><strong>اعتبار تمام شده</strong>فوکوس اول به «تمدید» می‌رود</p>
        </div>
      </div>
    </div>
    <p class="note"><b>پیشنهاد</b>مهلت «در حال اتصال» مثل گوشی ۲۰ ثانیه است و حدس است. کارتِ سرویسِ تمام‌شده روی تلویزیون همان کارت گوشی است، با «تمدید»ی که کد تصویری نشان می‌دهد.</p>
  </figure>

</main>
