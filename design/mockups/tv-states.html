          <div class="tv-col-content">
            <article class="card svc">
              <header class="svc-head">
                <div class="svc-titles">
                  <div class="svc-line"><h2 class="svc-name"><bdi dir="ltr">user123</bdi> · الماس</h2><span class="chip chip-positive">فعال</span></div>

                </div>
                <button class="btn btn-outline" type="button"><svg class="icon"><use href="#i-refresh"/></svg>به‌روزرسانی</button>

              <div class="usage">
                <div class="usage-row"><span>مصرف شده: <strong>۳۳</strong> از ۱۰۰ گیگ</span><span>باقی‌مانده: <strong>۶۷ گیگ</strong></span></div>

                <button class="btn btn-outline" type="button"><svg class="icon"><use href="#i-qr"/></svg>پشتیبانی</button>
              </div>
              <div class="list-head">
                <p class="list-caption"><strong>سرورها</strong> · سریع‌ترین بالا</p>
                <button class="btn btn-outline" type="button"><svg class="icon"><use href="#i-gauge"/></svg>پینگ همه</button>
              </div>
              <ul class="servers">
                  <li class="server"><svg class="flag"><use href="#f-nl"/></svg><span class="name">هلند ۱</span><span class="ping">۷۱</span><svg class="icon tick"><use href="#i-check"/></svg></li>
                  <li class="server is-selected"><svg class="flag"><use href="#f-de"/></svg><span class="name">آلمان ۲</span><span class="ping">۸۸</span><svg class="icon tick"><use href="#i-check"/></svg></li>
                  <li class="server"><svg class="flag"><use href="#f-fi"/></svg><span class="name">فنلاند ۲</span><span class="ping">۹۹</span><svg class="icon tick"><use href="#i-check"/></svg></li>
              </ul>
            </article>
          </div>
        </div>
        <section class="tv-power is-error">
          <div class="power-ring">
            <button class="power is-focused" type="button">
              <svg class="icon"><use href="#i-alert"/></svg>

              <span class="power-sub">دکمهٔ وسط: دوباره</span>
            </button>
          </div>
          <span class="now"><svg class="flag"><use href="#f-de"/></svg>آلمان ۲<span class="ping">۸۸</span></span>
          <p class="power-msg danger">اجازهٔ اتصال داده نشد.<br>دوباره وصل شو و در پنجرهٔ اندروید اجازه بده.</p>
        </section>
      </div>
    </div>
    <p class="note">در پنجرهٔ اجازهٔ اندروید «تأیید» زده نشد، یا پنجره بی‌جواب بسته شد. شکلِ «وصل نشد» است و فقط پیام فرق دارد. دکمهٔ وسط دوباره وصل می‌شود و اندروید دوباره می‌پرسد.</p>
    <p class="note">دستگاهی که اصلاً این پنجره را ندارد (بعضی باکس‌ها) همین قاب را می‌گیرد، با این پیام: «این دستگاه پنجرهٔ اجازهٔ اتصال را ندارد.» و «از «پشتیبانی» بپرس.»</p>
    <p class="note">متن اپ «اجازهٔ اتصال» می‌گوید، نه نامِ لاتینِ آن؛ مثل باقیِ نوشته‌های اپ.</p>
