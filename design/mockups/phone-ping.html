  <p>پینگ فقط با دکمهٔ عقربه‌ای کنار هر سرویس، فهرست مرتب از سریع به کند بعد از پینگ، و به‌روزرسانی اشتراک. اپ خودش پینگ نمی‌گیرد.</p>

    <p class="note">کنار نام سرویس دو دکمه است. چرخان سرورها و نشانی‌های تازه را می‌گیرد (به‌روزرسانی). عقربه از همهٔ سرورهای همین سرویس پینگ می‌گیرد و بعد فهرست را از سریع به کند مرتب می‌کند. زیر نام، زمان آخرین به‌روزرسانی است.</p>
    <p class="note">اپ خودش پینگ نمی‌گیرد: نه با باز شدن، نه با برگشتن به اپ، نه با رفتن به سرویس دیگر، نه بعد از به‌روزرسانی. پیش از اولین پینگ، فهرست به ترتیب پنل است و هیچ عددی ندارد؛ زیر دکمهٔ گرد هم سرورِ انتخاب‌شده بی‌عدد است. عددِ همان یک سرور بعد از وصل شدن می‌آید.</p>
    <p class="note">عددها تا پینگِ بعدیِ همان سرویس، یا تا بسته شدنِ کاملِ اپ، می‌مانند، بی‌زمان: جای آرامی کنار فهرست برایش نیست، و ترتیبِ سریع به کند چند ساعت بعد هم به کار می‌آید؛ یک بار زدنِ عقربه تازه‌اش می‌کند. سروری که به‌روزرسانی تازه آورده عدد ندارد و تا پینگِ بعدی ته فهرست است، کنار بی‌پاسخ‌ها، به ترتیب پنل.</p>
    <p class="note">بالای فهرست فقط جست‌وجو است. دکمهٔ «پینگ همه» برداشته شد، چون همان کار عقربه را می‌کرد: یک کار، یک دکمه، همیشه در سربرگ سرویس، چه کارت باز باشد چه جمع.</p>
    <p class="note"><b>پیشنهاد</b>کشیدن صفحه به پایین هم همین به‌روزرسانی را می‌کند، مثل بیشتر اپ‌های اندروید.</p>

    <p class="note">تا سروری انتخاب نشده، قرص زیر دکمهٔ گرد یک جملهٔ ساکن است، بی‌چرخنده: «سرور خودکار انتخاب می‌شود». تا «اتصال» یا عقربه زده نشود، چیزی در جریان نیست؛ چرخندهٔ همیشگی دروغ می‌گفت. هیچ ردیفی تیک ندارد.</p>
    <p class="note">با «اتصال»، اپ همان لحظه سرورها را می‌سنجد و به اولین سروری که جواب بدهد وصل می‌شود (قاب بعدی). با عقربه، بعد از پینگ سریع‌ترین سرور انتخاب می‌شود و قرص نامش را می‌گیرد. زدنِ یک ردیف هم همان را انتخاب می‌کند.</p>
    <p class="note">همین قرص وقتی هم می‌آید که به‌روزرسانی سرورِ انتخاب‌شده را حذف کند و از پینگِ قبلی عددی در دست نباشد. اگر عدد باشد، سریع‌ترینِ زنده جایش انتخاب می‌شود (قاب «سرورهای تازه و حذف‌شده»). اگر در همان لحظه وصل باشی، اپ مثل «اتصال» می‌سنجد و اتصال به اولین جواب می‌رود.</p>
    <p class="note">رفتن به سرویس دیگر پینگ نمی‌گیرد. اگر آن سرویس قبلاً سروری داشته، همان انتخاب می‌ماند؛ اگر نه، همین قرص.</p>
    <p class="note">سروری که خودِ مشتری برگزیده هرگز خودکار عوض نمی‌شود: اگر بعد از وصل شدن جواب ندهد، «وصل» می‌ماند و زیر قرص می‌آید ««آمریکا ۱» جواب نمی‌دهد. سرور دیگری را از فهرست انتخاب کن.» (قاب آخر تلویزیون؛ گوشی همان را زیر قرص دارد).</p>
    <p class="note"><b>پیشنهاد</b>سروری که خودِ اپ برگزیده جایش عوض می‌شود: اگر بعد از وصل شدن جواب ندهد، اپ یک بار همین سرویس را پینگ می‌گیرد، فهرست مرتب می‌شود و اتصال به سریع‌ترین می‌رود. پیامش دو جمله است: ««فنلاند ۲» جواب نداد.» و «اتصال همان لحظه به سریع‌ترین سرور، «آلمان ۲»، رفت.» این تنها پینگی است که اپ خودش می‌گیرد. اگر عقربهٔ مشتری در حالت قطع نشان دهد انتخابِ اپ بی‌پاسخ است، جمله دوم «سریع‌ترین سرور، «آلمان ۲»، جایش انتخاب شد.» است.</p>
    <p class="note">اپ هرگز ردیف اول را کورکورانه برنمی‌دارد: در اشتراک واقعی ردیف اول ردیف نسخه است، نه سرور. اپ خودش سرور را صریح انتخاب می‌کند و نمی‌گذارد موتور حدس بزند.</p>
    <p class="note"><b>پیشنهاد</b>ردیف‌هایی که سرور نیستند، مثل ردیف نسخه و «قبل از اتصال به‌روزرسانی کنید» که پنل برای اپ‌های عمومی می‌فرستد، در فهرست نمی‌آیند. اگر پنل حرفی برای مشتری دارد، جایش خط اطلاعیهٔ کارت است. این‌که اپ آن‌ها را چطور بشناسد، با برنامه‌نویس و پنل است.</p>

    <p class="note">زیر پیام «ارسال گزارش به پشتیبانی» است و با پیام می‌رود. پیامِ بی‌رنگِ زیر نام سرویس این دکمه را ندارد.</p>
    <p class="note">اگر به‌روزرسانیِ خودکارِ هنگام باز شدن نشد، پیام قرمز نمی‌آید و فقط زیر نام سرویس نوشته می‌شود (قاب حالت‌های سربرگ). اپ نباید با هر بار باز شدن هشدار بدهد.</p>
    <p class="note"><b>پیشنهاد</b>اگر نشانی اشتراک از ایران فقط با فیلترشکن باز شود، راه بهتر «اول وصل شو، بعد دوباره بزن» است. این به موتور بستگی دارد و هنوز سنجیده نشده.</p>

    <p class="note">پیام‌های خبری (سرور تازه، سرور حذف‌شده، رفتن اتصال به سرور دیگر) تا رفتن اپ به پس‌زمینه یا به‌روزرسانیِ بعدی می‌مانند، نه با زمان‌سنج: رفتنِ ناگهانی‌شان کارت را کوتاه می‌کند و ردیفِ زیر ریموت را جابه‌جا می‌کند. پیام «به‌روز نشد» تا تلاش موفقِ بعدی می‌ماند.</p>
    <p class="note">اگر سرورِ حذف‌شده همان انتخاب‌شده بود، سریع‌ترین سرورِ زنده جایش انتخاب می‌شود و پیام همین را می‌گوید؛ اگر وصل بود، اتصال هم همان لحظه به آن می‌رود (دو کارت آخرِ قاب سربرگ‌ها، و قاب آخر تلویزیون).</p>
