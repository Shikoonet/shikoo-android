  <p>پینگ خودکار همهٔ سرورها، فهرست مرتب از سریع به کند، و به‌روزرسانی اشتراک. قاب‌های صفحه‌های قبلی هنوز این‌ها را ندارند.</p>

    <p class="note">بالای فهرست جست‌وجو و «پینگ همه» است. مرتب‌سازی دکمه ندارد: فهرست همیشه از سریع به کند است و بی‌پاسخ‌ها ته آن‌اند.</p>
    <p class="note">ردیف‌های زیر لبهٔ پایین در قاب «بعد از سنجش» پیدایند.</p>
    <p class="note"><b>پیشنهاد</b>کشیدن صفحه به پایین هم همین به‌روزرسانی را می‌کند، مثل بیشتر اپ‌های اندروید.</p>

    <p class="note">در این مدت ترتیب عوض نمی‌شود. فهرست فقط یک بار مرتب می‌شود: وقتی همه جواب دادند. سروری که تا مهلت جواب ندهد «بی‌پاسخ» می‌شود.</p>
    <p class="note"><b>پیشنهاد</b>عدد پینگ زمانِ یک درخواست واقعی از راه همان سرور است («تأخیر واقعی»)، نه فقط رسیدن به خودِ سرور؛ پس سروری که باز است ولی ترافیک رد نمی‌کند «بی‌پاسخ» می‌شود. این‌که موتور دقیقاً چه می‌دهد را برنامه‌نویس دارد بررسی می‌کند.</p>
