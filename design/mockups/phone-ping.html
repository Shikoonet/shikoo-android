  <p>پینگ خودکار همهٔ سرورها، فهرست مرتب از سریع به کند، و به‌روزرسانی اشتراک. قاب‌های صفحه‌های قبلی هنوز این‌ها را ندارند.</p>

    <p class="note">بالای فهرست جست‌وجو و «پینگ همه» است. مرتب‌سازی دکمه ندارد: فهرست همیشه از سریع به کند است، و بی‌پاسخ‌ها و سنجیده‌نشده‌ها ته آن‌اند، به ترتیب پنل.</p>
    <p class="note">ردیف‌های زیر لبهٔ پایین در قاب «بعد از سنجش» پیدایند.</p>
    <p class="note"><b>پیشنهاد</b>کشیدن صفحه به پایین هم همین به‌روزرسانی را می‌کند، مثل بیشتر اپ‌های اندروید.</p>

    <p class="note">تنها نشانه‌ها: دکمهٔ کنار نام می‌چرخد، زیر نام «در حال به‌روزرسانی…» است، و جای پینگ هر سرور یک چرخنده است. اگر سرورِ انتخاب‌شده هنوز در فهرست است، دکمهٔ گرد از لحظهٔ اول با همان وصل می‌شود؛ اگر نیست، قاب بعدی.</p>
    <p class="note">به‌روزرسانیِ خودکار هم با اجرای تازهٔ اپ است و هم با برگشتن به آن، هر دو فقط اگر بیش از ۱۰ دقیقه از آخرین به‌روزرسانیِ موفق گذشته باشد.</p>
