<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شیکو · تلویزیون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="mockup.css">
<script src="mockup.js"></script>
</head>
<body>

<header class="sheet-head">
  <h1>شیکو · صفحه‌های تلویزیون</h1>
  <p>فقط چیدمان و جریان. رنگ‌ها موقت‌اند. هر قاب ۹۶۰×۵۴۰ نقطه است و عکسش ۱۹۲۰×۱۰۸۰.</p>
  <nav class="sheet-nav">
    <a href="phone.html">گوشی</a>
    <a href="phone-states.html">حالت‌های گوشی</a>
    <a href="phone-ping.html">پینگ گوشی</a>
    <a href="tv.html" aria-current="page">تلویزیون</a>
    <a href="tv-states.html">حالت‌های تلویزیون</a>
    <a href="tv-ping.html">پینگ تلویزیون</a>
  </nav>
  <button class="theme-toggle" type="button" onclick="toggleTheme()">روشن / تیره</button>
</header>

<main class="board tv-board">

  <!-- ورود -->
  <figure class="shot">
    <figcaption>ورود · کد تصویری و کد کوتاه</figcaption>
    <div class="tv" data-device="tv" data-frame="tv-login">
      <div class="tv-login">
        <div class="login-copy">
          <div class="brand"><span class="mark">ش</span><span>شیکو</span></div>
          <h1>ورود با تلگرام</h1>
          <p class="lead">با دوربین گوشی اسکن کن و در تلگرام تأیید کن</p>
          <div class="code-box">
            <span class="code-label">اسکن نشد؟ این کد را در ربات شیکو بفرست</span>
            <span class="code">K7P2-9QXM</span>
          </div>
          <p class="fine">کد هر ۵ دقیقه خودکار عوض می‌شود.</p>
        </div>
        <div class="qr-tile"><svg class="qr" role="img" aria-label="QR نمونه"></svg></div>
      </div>
    </div>
    <p class="note"><b>پیشنهاد</b>«اسکن نشد؟ این کد را در ربات شیکو بفرست» و «کد هر ۵ دقیقه خودکار عوض می‌شود» به سمت سرورِ ورود بستگی دارند که هنوز ساخته نشده. ۵ دقیقه حدس است.</p>
  </figure>

  <!-- خانه، وصل؛ فوکوس ریموت روی «فنلاند ۲» -->
  <figure class="shot">
    <figcaption>خانه · وصل · ریموت روی «فنلاند ۲»</figcaption>
    <div class="tv" data-device="tv" data-frame="tv-home">
      <header class="tv-top">
        <div class="brand"><span class="mark">ش</span><span>شیکو</span></div>
        <button class="btn btn-outline" type="button"><svg class="icon"><use href="#i-gear"/></svg>تنظیمات</button>
      </header>
      <div class="tv-home">
        <div class="tv-col">
          <div class="tv-col-content">
            <article class="card svc">
              <header class="svc-head">
                <h2 class="svc-name"><bdi dir="ltr">user123</bdi> · الماس</h2>
                <span class="chip chip-positive">فعال</span>
              </header>
              <div class="usage">
                <div class="usage-row"><span>مصرف شده: <strong>۳۳</strong> از ۱۰۰ گیگ</span><span>باقی‌مانده: <strong>۶۷ گیگ</strong></span></div>
                <div class="bar"><span style="inline-size: 33%"></span></div>
                <div class="usage-row"><span>اعتبار تا ۳ آبان ۱۴۰۵</span><span>۲۳ روز باقی‌مانده</span></div>
              </div>
              <p class="notice"><svg class="icon"><use href="#i-bell"/></svg><span>امشب ۲ تا ۳ بامداد سرور آمریکا به‌روز می‌شود</span></p>
              <div class="actions">
                <button class="btn btn-primary" type="button"><svg class="icon"><use href="#i-qr"/></svg>تمدید</button>
                <button class="btn btn-outline" type="button"><svg class="icon"><use href="#i-qr"/></svg>پشتیبانی</button>
              </div>
              <ul class="servers">
                <li class="server is-selected"><svg class="flag"><use href="#f-de"/></svg><span class="name">آلمان ۲<bdi class="proto">V2Ray</bdi></span><span class="ping">۸۴</span><svg class="icon tick"><use href="#i-check"/></svg></li>
                <li class="server is-focused"><svg class="flag"><use href="#f-fi"/></svg><span class="name">فنلاند ۲<bdi class="proto">V2Ray</bdi></span><span class="ping">۱۱۲</span><svg class="icon tick"><use href="#i-check"/></svg></li>
                <li class="server"><svg class="flag"><use href="#f-nl"/></svg><span class="name">هلند ۱<bdi class="proto">V2Ray</bdi></span><span class="ping">۹۶</span><svg class="icon tick"><use href="#i-check"/></svg></li>
                <li class="server"><svg class="flag"><use href="#f-us"/></svg><span class="name">آمریکا ۲<bdi class="proto">V2Ray</bdi></span><span class="ping ok">۱۸۸</span><svg class="icon tick"><use href="#i-check"/></svg></li>
                <li class="server"><svg class="flag"><use href="#f-gb"/></svg><span class="name">انگلیس<bdi class="proto">V2Ray</bdi></span><span class="ping bad">بی‌پاسخ</span><svg class="icon tick"><use href="#i-check"/></svg></li>
              </ul>
            </article>
          </div>
        </div>
        <section class="tv-power is-on">
          <div class="power-ring">
            <button class="power" type="button">
              <svg class="icon"><use href="#i-power"/></svg>
              <span class="power-label">وصل</span>
              <span class="timer">۰۰:۱۲:۴۷</span>
            </button>
          </div>
          <span class="now"><svg class="flag"><use href="#f-de"/></svg>آلمان ۲<span class="ping">۸۴</span></span>
        </section>
      </div>
    </div>
    <p class="note">نوار سبزِ کنار ردیف یعنی سرورِ انتخاب‌شده؛ حلقهٔ ضخیم یعنی ریموت روی آن است. ستونِ سمت راست یکجا اسکرول می‌شود؛ ردیف آخر از لبهٔ پایین بیرون زده.</p>
    <p class="note">آیکونِ کد تصویری روی «تمدید» و «پشتیبانی» یعنی این دو روی تلویزیون یک کد تصویری برای گوشی نشان می‌دهند، چون تلویزیون تلگرام ندارد.</p>
  </figure>

</main>
</body>
</html>
